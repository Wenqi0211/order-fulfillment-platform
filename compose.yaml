name: wenqi-order-platform
x-app-environment: &app-environment
  APP_API_KEY: ${APP_API_KEY:?Run python3 scripts/init_env.py first}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_LISTENERS_ENABLED: "true"
  KAFKA_TOPICS_ENABLED: "false"
  KAFKA_REPLICATION_FACTOR: "1"
  OUTBOX_ENABLED: "true"
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=20.0 -XX:+ExitOnOutOfMemoryError
x-app-defaults: &app-defaults
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 30s
  mem_limit: 768m
  cpus: 1.0
  networks: [backend]
  depends_on:
    postgres: {condition: service_healthy}
    kafka-init: {condition: service_completed_successfully}
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run init_env.py}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Run init_env.py}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Run init_env.py}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Run init_env.py}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U platform_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [backend]
  redis:
    image: redis:8.2.2-bookworm
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run init_env.py}
    command: [sh, -c, 'exec redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"']
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    environment:
      CLUSTER_ID: q1Sh-9_ISia_zwGINzRvyQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["127.0.0.1:9092:9092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    mem_limit: 1g
    networks: [backend]
  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        for topic in fulfillment.events.v1 warehouse.status.v1 warehouse.status.v1.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1 --config min.insync.replicas=1 --config retention.ms=604800000
        done
    networks: [backend]
  inventory-service:
    <<: *app-defaults
    build: {context: ., args: {SERVICE: inventory-service}}
    image: ${INVENTORY_IMAGE:-wenqi-order-platform/inventory:local}
    environment:
      <<: *app-environment
      PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      DB_USER: inventory_app
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL_ENABLED: "false"
      INVENTORY_CACHE_ENABLED: ${INVENTORY_CACHE_ENABLED:-true}
      INVENTORY_CACHE_TTL_SECONDS: ${INVENTORY_CACHE_TTL_SECONDS:-30}
      INVENTORY_CACHE_MAX_IN_FLIGHT: ${INVENTORY_CACHE_MAX_IN_FLIGHT:-256}
      INVENTORY_CACHE_FAILURE_COOLDOWN_MS: ${INVENTORY_CACHE_FAILURE_COOLDOWN_MS:-1000}
    ports: ["127.0.0.1:8081:8081"]
  payment-service:
    <<: *app-defaults
    build: {context: ., args: {SERVICE: payment-service}}
    image: wenqi-order-platform/payment:local
    environment:
      <<: *app-environment
      PORT: "8082"
      DB_URL: jdbc:postgresql://postgres:5432/payment
      DB_USER: payment_app
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports: ["127.0.0.1:8082:8082"]
  order-service:
    <<: *app-defaults
    build: {context: ., args: {SERVICE: order-service}}
    image: wenqi-order-platform/order:local
    environment:
      <<: *app-environment
      PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: order_app
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      INVENTORY_BASE_URL: http://inventory-service:8081
      PAYMENT_BASE_URL: http://payment-service:8082
    ports: ["127.0.0.1:8080:8080"]
networks:
  backend: {}
volumes:
  postgres-data: {}
  redis-data: {}
  kafka-data: {}
