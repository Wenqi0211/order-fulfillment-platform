worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS returns one address per order-service replica.
    # NGINX OSS >=1.27.3 refreshes this shared upstream without an edge restart.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream orders {
        zone orders 64k;
        server order-service:8080 resolve max_fails=2 fail_timeout=5s;
        keepalive 16;
    }

    log_format routing escape=json
        '{"time":"$time_iso8601","request_id":"$upstream_http_x_request_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout routing;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    # The application enforces its 64 KiB JSON limit and returns its JSON error.
    client_max_body_size 1m;

    server {
        listen 8080;
        location / {
            proxy_pass http://orders;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # API key and caller request ID pass through; the app validates both.
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 15s;
            proxy_next_upstream error timeout;
            # Allow all three demonstration peers to be tried after connection failures.
            # Do not enable non_idempotent retries after a POST has reached an upstream.
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 4s;
        }
    }
}
