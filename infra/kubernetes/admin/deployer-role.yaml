# Platform administrator installs this namespace-scoped role before CI deployment.
# RoleBinding identity is deliberately supplied by the cluster identity provider.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: order-platform-deployer
  namespace: order-staging
rules:
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [delete]
  - apiGroups: [""]
    resources: [services, configmaps, serviceaccounts]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, patch, update]
