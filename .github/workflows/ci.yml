name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_database_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/postgres
      TEST_DATABASE_USER: postgres
      TEST_DATABASE_PASSWORD: ci_ephemeral_database_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: .tooling/m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - run: ./mvnw -B -ntp -Pintegration verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 14
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - run: python3 scripts/check_manifests.py
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.10
      - name: Render both Kubernetes environments
        run: |
          kubectl kustomize infra/kubernetes/overlays/staging > /tmp/staging.yaml
          kubectl kustomize infra/kubernetes/overlays/prod > /tmp/prod.yaml
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/init_env.py
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 360
      - run: python3 scripts/smoke.py
      - run: python3 scripts/api_contract_smoke.py
      - run: python3 scripts/fault_smoke.py
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-verification
          path: reports/
          retention-days: 14
      - run: docker compose down --volumes
        if: always()
  observability-and-scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/init_env.py
      - run: python3 scripts/init_observability.py
      - name: Start scaled local deployment and monitoring
        run: docker compose -f compose.yaml -f compose.scaling.yaml -f compose.observability.yaml up --build -d --wait --wait-timeout 360
      - name: Validate Prometheus configuration and alert rules
        run: |
          docker compose -f compose.yaml -f compose.observability.yaml run --rm --no-deps --entrypoint /bin/promtool prometheus check config /etc/prometheus/prometheus.yml
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --mount "type=bind,src=$PWD/infra/observability/prometheus,dst=/etc/prometheus,readonly" --workdir /etc/prometheus --entrypoint /bin/promtool prom/prometheus:v3.15.1 test rules alerts.test.yml
      - name: Verify replica routing and cross-replica idempotency
        run: python3 scripts/scaling_smoke.py --expected-replicas 2
      - name: Verify monitoring with dependency outage and recovery
        run: python3 scripts/observability_smoke.py --faults --expected-order-replicas 2
      - name: Verify manual scale-out and scale-in
        run: |
          docker compose -f compose.yaml -f compose.scaling.yaml -f compose.observability.yaml up -d --no-build --scale order-service=3 --wait --wait-timeout 180
          python3 scripts/scaling_smoke.py --expected-replicas 3
          docker compose -f compose.yaml -f compose.scaling.yaml -f compose.observability.yaml up -d --no-build --scale order-service=2 --wait --wait-timeout 180
          python3 scripts/scaling_smoke.py --expected-replicas 2
      - name: Collect local deployment logs
        if: always()
        run: |
          mkdir -p reports
          docker compose -f compose.yaml -f compose.scaling.yaml -f compose.observability.yaml logs --no-color > reports/observability-compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observability-and-scaling-results
          path: reports/
          retention-days: 14
      - run: docker compose -f compose.yaml -f compose.scaling.yaml -f compose.observability.yaml down --volumes
        if: always()
  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-and-integration, compose-smoke, observability-and-scaling]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [order, inventory, payment]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve commit-tagged release name
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "RELEASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}-service:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: SERVICE=${{ matrix.service }}-service
          tags: ${{ env.RELEASE_IMAGE }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Record exact image digest
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release
          printf '%s\n' "$IMAGE_DIGEST" > "release/${SERVICE}-service.digest"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.service }}
          path: release/
          retention-days: 90
          overwrite: true
